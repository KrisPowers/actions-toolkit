name: Demo
on:
  push:
  workflow_dispatch:
    inputs:
      greeting:
        default: Hello

env:
  APP: atk-demo

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: meta
        run: |
          echo "version=1.2.3" >> "$ATK_OUTPUT"
          echo "BUILD_MODE=release" >> "$ATK_ENV"
      - name: Use env from previous step
        run: |
          echo "building $APP in $BUILD_MODE mode"
          test "$BUILD_MODE" = "release"
      - name: Add a tool to PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho custom-tool says hi\n' > "$RUNNER_TEMP/bin/custom-tool"
          chmod +x "$RUNNER_TEMP/bin/custom-tool"
          echo "$RUNNER_TEMP/bin" >> "$ATK_PATH"
      - name: Call the tool
        run: custom-tool
      - name: Masked secret
        run: echo "the token is ${{ secrets.TOKEN }}"

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
        include:
          - node: 20
            label: current
    steps:
      - name: Matrix ${{ matrix.node }}
        run: echo "node=${{ matrix.node }} label=${{ matrix.label }} version=${{ needs.build.outputs.version }}"
      - name: Local composite action
        id: greet
        uses: ./.github/actions/greet
        with:
          who: matrix ${{ matrix.node }}
      - run: echo "action said '${{ steps.greet.outputs.message }}'"
      - name: Allowed to fail
        continue-on-error: true
        run: exit 3
      - name: Only on main
        if: atk.ref == 'refs/heads/does-not-exist'
        run: echo "should be skipped"

  report:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "build=${{ needs.build.result }} test=${{ needs.test.result }}"
